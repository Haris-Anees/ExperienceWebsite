name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3

      # Get GitHub OIDC token
      - name: Get GitHub ID Token
        id: idtoken
        uses: actions/github-script@v6
        with:
          script: return await github.actions.getIDToken();

      # Deploy static site
      - name: Deploy Static Site to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          app_location: "/"          # Your Mobirise export folder
          api_location: ""           # No API
          output_location: "/"       # Static files location
          skip_app_build: true       # Skip building, files already static
          github_id_token: ${{ steps.idtoken.outputs.result }}