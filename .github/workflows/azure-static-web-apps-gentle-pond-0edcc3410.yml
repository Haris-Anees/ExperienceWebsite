name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Static Site
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          app_location: "/"        # your Mobirise export folder
          api_location: ""         # none
          output_location: "/"     # files already static
          skip_app_build: true
          github_id_token: ${{ github.token }}